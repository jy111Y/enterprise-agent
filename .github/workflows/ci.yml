name: Enterprise Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --tag enterprise-agent:ci \
            .



# 有人 push 或发 PR 到 main
#         ↓
# 触发工作流
#         ↓
# Job 1: test
#   ├── 检出代码
#   ├── 安装 Python 3.11
#   ├── 安装依赖
#   └── 运行 pytest
#         ↓
# 如果 test 通过
#         ↓
# Job 2: docker-build
#   ├── 检出代码
#   └── 构建 Docker 镜像
#         ↓
# 全部完成